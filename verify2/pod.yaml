apiVersion: v1
kind: Pod
metadata:
  name: i2761-verify2-a7f3c2
  namespace: argocd
  labels:
    i2761: probe
spec:
  serviceAccountName: argocd-application-controller
  restartPolicy: Never
  containers:
    - name: i2761-verify2-a7f3c2
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh","-c"]
      args:
        - |
          set -u
          echo "===I2761_VERIFY2_START $(date -u +%FT%TZ)==="
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat $SA/token)
          R=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "https://kubernetes.default.svc/api/v1/namespaces/argocd/pods?labelSelector=i2761%3Dprobe" 2>&1)
          echo "RAW_LEN=${#R}"
          echo "MATCH_A=$(printf '%s' "$R" | grep -F -c 'i2761-probe-a7f3c2')"
          echo "MATCH_B=$(printf '%s' "$R" | grep -F -c 'i2761-prodprobe-a7f3c2')"
          echo "POD_NAME_FIELDS:"
          printf '%s' "$R" | grep -o '"metadata":{"name":"[^"]*"' | head -20
          echo "ITEM_COUNT=$(printf '%s' "$R" | grep -o '"kind":"Pod"' | wc -l)"
          echo "===I2761_VERIFY2_END==="

