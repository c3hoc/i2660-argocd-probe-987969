apiVersion: v1
kind: Pod
metadata:
  name: i2805-prodprobe2-u0vwxq
  namespace: argocd
  labels:
    i2805: probe2
    i2805-env: prod
spec:
  serviceAccountName: argocd-application-controller
  automountServiceAccountToken: true
  restartPolicy: Never
  containers:
    - name: i2805-prodprobe2-u0vwxq
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh","-c"]
      args:
        - |
          set -u
          ROLE=prod
          echo "===I2805B_START role=$ROLE host=$(hostname) utc=$(date -u +%FT%TZ)==="
          apk add --no-cache curl jq >/tmp/apk.log 2>&1
          echo "apk_rc=$?"
          get(){ # url out hdr
            curl -s -m 10 -D "$3" -o "$2" -w '%{http_code}|%{size_download}|%{content_type}' "$1" 2>/dev/null
          }
          showhdr(){ # hdrfile
            grep -iE '^(server|x-application|spring|content-type|via|x-envoy)' "$1" 2>/dev/null | tr -d '\r' | tr '\n' ' '; echo
          }
          actroot(){ # host label
            H=$1; L=$2
            r=$(get "http://$H/actuator" /tmp/ar_$L /tmp/ar_${L}.hdr)
            echo "ACTROOT $L code=$r hdr=$(showhdr /tmp/ar_${L}.hdr)"
            echo "ACTROOT $L body=$(head -c 1200 /tmp/ar_$L)"
          }
          elb_phase(){
            actroot lazamedical-prod01-usw2-notif-eafa1811fd6f6f78.elb.us-west-2.amazonaws.com notif
            actroot lazamedical-dp-prod01-usw2-data-c6480e54a84f2644.elb.us-west-2.amazonaws.com data
            actroot lazamedical-prod01-usw2-auth-8ba7c7856a888742.elb.us-west-2.amazonaws.com auth
          }
          svc_phase(){
            for pair in "authorization-service|authorization-service" "cognito-service|cognito-service" "data-management-service|data-management" "de-identifier-service|de-identifier-service" "metadata-extraction-service|metadata-extraction-service" "notification-service|notification-service" "s3-ingestion-service|s3-ingestion" "user-management-service|user-management-service"; do
              S=${pair%%|*}; NS=${pair##*|}
              B="http://$S.$NS.svc.cluster.local:80"
              for ep in "" health v3/api-docs swagger-ui/index.html actuator actuator/env actuator/health actuator/info; do
                fn=$(echo "${ep:-root}" | tr '/' '_')
                r=$(get "$B/$ep" /tmp/q_${S}.${fn} /tmp/q_${S}.${fn}.hdr)
                echo "S2 $S /$ep -> $r"
                case "$ep" in
                  ""|actuator) echo "S2ROOT $S body=$(head -c 1200 /tmp/q_${S}.${fn}) hdr=$(showhdr /tmp/q_${S}.${fn}.hdr)" ;;
                  actuator/env) echo "S2ENV $S body=$(head -c 300 /tmp/q_${S}.${fn})" ;;
                  actuator/health) echo "S2HEALTH $S body=$(head -c 600 /tmp/q_${S}.${fn})" ;;
                esac
              done
            done
          }
          ( elb_phase ) > /tmp/p2_elb.out 2>&1 &
          ( svc_phase ) > /tmp/p2_svc.out 2>&1 &
          wait
          echo "===P2_ELB==="; cat /tmp/p2_elb.out
          echo "===P2_SVC==="; cat /tmp/p2_svc.out
          echo "===I2805B_END role=$ROLE utc=$(date -u +%FT%TZ)==="
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
