apiVersion: v1
kind: Pod
metadata:
  name: i2761-verify-a7f3c2
  namespace: argocd
  labels:
    i2761: probe
spec:
  serviceAccountName: argocd-application-controller
  restartPolicy: Never
  containers:
    - name: i2761-verify-a7f3c2
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh","-c"]
      args:
        - |
          set -u
          echo "===I2761_VERIFY_START host=$(hostname) $(date -u +%FT%TZ)==="
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat $SA/token)
          API=https://kubernetes.default.svc
          R=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/argocd/pods?labelSelector=i2761%3Dprobe" 2>&1)
          echo "RAW_LEN=$(echo "$R" | wc -c)"
          echo "$R" | tr ',' '\n' | grep -E '"name"|"phase"' | head -40
          echo "HAS_I2761_PROBE=$(echo "$R" | grep -c 'i2761-probe-a7f3c2\|i2761-prodprobe-a7f3c2')"
          echo "===I2761_VERIFY_END==="

