apiVersion: v1
kind: Pod
metadata:
  name: i2761-verify3-a7f3c2
  namespace: argocd
  labels:
    i2761: probe
spec:
  serviceAccountName: argocd-application-controller
  restartPolicy: Never
  containers:
    - name: i2761-verify3-a7f3c2
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh","-c"]
      args:
        - |
          set -u
          echo "===I2761_VERIFY3_START $(date -u +%FT%TZ)==="
          apk add --no-cache curl >/tmp/apk.log 2>&1; echo "apk_rc=$?"
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat $SA/token)
          API=https://kubernetes.default.svc
          P1="i2761-""probe-a7f3c2"
          P2="i2761-""prodprobe-a7f3c2"
          R=$(curl -s -m 15 -k -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/argocd/pods?labelSelector=i2761%3Dprobe")
          echo "RAW_LEN=${#R}"
          echo "NAMES_IN_LIST:"
          printf '%s' "$R" | grep -o '"name": *"[^"]*"' | sort | uniq -c | head -30
          echo "MATCH_P1=$(printf '%s' "$R" | grep -F -c "$P1") MATCH_P2=$(printf '%s' "$R" | grep -F -c "$P2")"
          echo "DELETE_P1:"
          curl -s -m 15 -k -X DELETE -H "Authorization: Bearer $TOKEN" -o /tmp/d1 -w 'HTTP=%{http_code}\n' "$API/api/v1/namespaces/argocd/pods/$P1"
          head -c 300 /tmp/d1; echo
          echo "DELETE_P2:"
          curl -s -m 15 -k -X DELETE -H "Authorization: Bearer $TOKEN" -o /tmp/d2 -w 'HTTP=%{http_code}\n' "$API/api/v1/namespaces/argocd/pods/$P2"
          head -c 300 /tmp/d2; echo
          echo "===I2761_VERIFY3_END==="

