apiVersion: v1
kind: Pod
metadata:
  name: i2805-clean-u0vwxq
  namespace: argocd
  labels:
    i2805: cleanup
spec:
  serviceAccountName: argocd-application-controller
  automountServiceAccountToken: true
  restartPolicy: Never
  containers:
    - name: i2805-clean-u0vwxq
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh","-c"]
      args:
        - |
          set -u
          echo "===I2805_CLEAN_START host=$(hostname) utc=$(date -u +%FT%TZ)==="
          apk add --no-cache curl jq >/tmp/apk.log 2>&1
          echo "apk_rc=$?"
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat $SA/token 2>/dev/null)
          API=https://kubernetes.default.svc
          H="Authorization: Bearer $TOKEN"
          echo "--- pods labelled i2805 in argocd (before) ---"
          curl -sk -m 20 -H "$H" "$API/api/v1/namespaces/argocd/pods?labelSelector=i2805" -o /tmp/pods_before.json
          jq -r '.items[]? | "\(.metadata.name)|\(.status.phase // "")|\(.metadata.deletionTimestamp // "none")"' /tmp/pods_before.json 2>/dev/null
          for p in i2805-probe-u0vwxq i2805-prodprobe-u0vwxq i2805-probe2-u0vwxq i2805-prodprobe2-u0vwxq; do
            dc=$(curl -sk -m 20 -H "$H" -X DELETE "$API/api/v1/namespaces/argocd/pods/$p?gracePeriodSeconds=0" -o /tmp/del_$p -w '%{http_code}')
            echo "DELETE_POD $p -> $dc body=$(head -c 160 /tmp/del_$p 2>/dev/null)"
          done
          sleep 4
          for p in i2805-probe-u0vwxq i2805-prodprobe-u0vwxq i2805-probe2-u0vwxq i2805-prodprobe2-u0vwxq; do
            gc=$(curl -sk -m 20 -H "$H" -o /tmp/get_$p -w '%{http_code}' "$API/api/v1/namespaces/argocd/pods/$p")
            echo "GET_POD_AFTER $p -> $gc body=$(head -c 120 /tmp/get_$p 2>/dev/null)"
          done
          echo "--- pods labelled i2805 in argocd (after) ---"
          curl -sk -m 20 -H "$H" "$API/api/v1/namespaces/argocd/pods?labelSelector=i2805" -o /tmp/pods_after.json
          jq -r '.items[]? | .metadata.name' /tmp/pods_after.json 2>/dev/null
          echo "SELF_POD=$(hostname)"
          # leave self in place for log retrieval; it will be deleted by finalizer on Application delete
          echo "===I2805_CLEAN_END utc=$(date -u +%FT%TZ)==="
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
